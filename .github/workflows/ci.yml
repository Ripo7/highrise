name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04 # Playwright 1.56 installs its browser deps on 24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Physics, scoring, slope design, hexagon grid, tile actions and jumps
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test (design a slope, select tiles and act, copy and paste, edit the slope, ride, pause and act, ride on)
        run: npm run smoke
      - name: Keep the smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-shots/
          if-no-files-found: ignore
