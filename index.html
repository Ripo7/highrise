<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Highrise</title>
    <meta name="description" content="Sculpt a mountain, send a skier, chase the perfect line." />
    <meta name="theme-color" content="#c9dbe8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 27 13 8l5 8 3-4 9 15z' fill='%2314202b'/%3E%3Cpath d='m13 8 3 5-3-1-2 2z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="scene" aria-label="Mountain you can sculpt"></canvas>

    <header class="brand">
      <span class="brand-mark">Highrise</span>
      <span class="brand-sub">Ski · prototype 0</span>
    </header>

    <nav id="tools" class="tools panel" aria-label="Tools"></nav>

    <section class="hud panel" aria-label="Run">
      <div class="hud-head">
        <span id="status" class="status" data-status="idle">Ready</span>
        <span class="best">Best <b id="s-best">—</b></span>
      </div>
      <dl class="stats">
        <div><dt>Time</dt><dd><span id="s-time">0.00</span><small>s</small></dd></div>
        <div><dt>Speed</dt><dd><span id="s-speed">0</span><small>km/h</small></dd></div>
        <div><dt>Top</dt><dd><span id="s-top">0</span><small>km/h</small></dd></div>
        <div><dt>Air</dt><dd><span id="s-air">0.0</span><small>s</small></dd></div>
        <div><dt>Jumps</dt><dd><span id="s-jumps">0</span></dd></div>
      </dl>
    </section>

    <footer class="dock">
      <div class="panel brush">
        <label class="slider">
          <span>Size <output id="radius-out"></output></span>
          <input id="radius" type="range" min="3" max="40" step="1" />
        </label>
        <label class="slider">
          <span>Strength <output id="strength-out"></output></span>
          <input id="strength" type="range" min="5" max="100" step="5" />
        </label>
        <div class="btn-row">
          <button id="undo" class="btn" type="button" title="Undo (Ctrl+Z)">Undo</button>
          <button id="redo" class="btn" type="button" title="Redo (Ctrl+Shift+Z)">Redo</button>
          <button id="reset" class="btn btn-quiet" type="button">New mountain</button>
        </div>
        <div class="btn-row toggles">
          <label class="check"><input id="follow" type="checkbox" /> Follow skier <kbd>F</kbd></label>
          <label class="check"><input id="contours" type="checkbox" /> Contours <kbd>C</kbd></label>
          <button id="reset-view" class="btn btn-quiet" type="button" title="Reset view (R)">Reset view</button>
        </div>
      </div>
      <button id="send" class="send" type="button" title="Send skier (Space)">
        <span>Send skier</span><kbd>Space</kbd>
      </button>
    </footer>

    <p class="hint">
      <span class="hint-desktop">Drag to sculpt · Right-drag to orbit · Scroll to zoom</span>
      <span class="hint-touch">One finger sculpts · Two fingers orbit and zoom</span>
    </p>

    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
